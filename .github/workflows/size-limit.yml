name: Size Limit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # This basic check runs size-limit for the current branch.
  # It will fail if the branch pushes the size over the specified budget.
  size-limit-basic:
    if: ${{ github.event.pull_request.head.repo.full_name != 'withastro/starlight' }}
    name: Check build output is within performance budget (forks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
      - run: 'pnpm build:examples'
      - run: pnpm size

  # This check cannot run in forks, so is only run for PRs from this repo.
  # It will run size-limit for both `main` and the PR branch and comment in the PR with changes.
  size-limit:
    # Skip on Changesets draft release PRs.
    if: >
      github.event.pull_request.head.repo.full_name == 'withastro/starlight' &&
      !(github.event.pull_request.draft &&
        github.head_ref == 'changeset-release/main')
    name: Check build output is within performance budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: false
      - name: Run size-limit
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.FREDKBOT_GITHUB_TOKEN }}
          build_script: 'build:examples'
          package_manager: pnpm
          script: pnpm exec size-limit --json
