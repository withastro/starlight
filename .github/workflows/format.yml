name: Format

on:
  push:
    branches:
      - main

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  format:
    if: github.repository_owner == 'withastro'
    permissions:
      contents: write
    uses: withastro/automation/.github/workflows/format.yml@d6bf66bb1fbfb68577eccfa1211ff7357fea0054 # v1.3.3
    with:
      command: "format"
    secrets:
      FREDKBOT_GITHUB_TOKEN: ${{ secrets.FREDKBOT_GITHUB_TOKEN }}
