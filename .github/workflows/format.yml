name: Format

on:
  push:
    branches:
      - main

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  format:
    if: github.repository_owner == 'withastro'
    permissions:
      contents: write
    uses: withastro/automation/.github/workflows/format.yml@4105de6eb7f9f5ead48cef759e197b38db2b82b1 # v1.3.4
    with:
      command: "format"
    secrets:
      FREDKBOT_GITHUB_TOKEN: ${{ secrets.FREDKBOT_GITHUB_TOKEN }}
