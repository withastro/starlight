name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'packages/starlight/**'
      - '!packages/starlight/__tests__/**'
      - '!packages/starlight/__e2e__/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/starlight/**'
      - '!packages/starlight/__tests__/**'
      - '!packages/starlight/__e2e__/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  benchmarks:
    # Skip benchmarks on Changesets draft release PRs.
    if: >
      github.repository_owner == 'withastro' &&
      !(github.event.pull_request.draft &&
        github.head_ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == 'withastro/starlight')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          install: false
      - run: pnpm i --filter @astrojs/starlight
      - name: Run benchmarks
        uses: CodSpeedHQ/action@b1f28b5eccf7cb5bfe6a2a89cb3053eb67f1150c # v5.8.0
        with:
          mode: simulation
          run: pnpm --filter @astrojs/starlight bench:functional

  e2e-benchmarks:
    # Skip benchmarks on Changesets draft release PRs.
    if: >
      github.repository_owner == 'withastro' &&
      !(github.event.pull_request.draft &&
        github.head_ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == 'withastro/starlight')
    # https://codspeed.io/docs/features/macro-runners#amd-ryzen-9950x-x86_64
    runs-on: codspeed-macro-x64-ryzen-9950x-ubuntu-24-04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          install: false
      - run: pnpm i --filter @astrojs/starlight --filter "@bench/*"
      - name: Run E2E benchmarks
        uses: CodSpeedHQ/action@b1f28b5eccf7cb5bfe6a2a89cb3053eb67f1150c # v5.8.0
        with:
          mode: walltime
          run: pnpm --filter @astrojs/starlight bench:e2e
