name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'packages/starlight/**'
      - '!packages/starlight/__tests__/**'
      - '!packages/starlight/__e2e__/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/starlight/**'
      - '!packages/starlight/__tests__/**'
      - '!packages/starlight/__e2e__/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  benchmarks:
    # Skip benchmarks on Changesets draft release PRs.
    if: >
      github.repository_owner == 'withastro' &&
      !(github.event.pull_request.draft &&
        github.head_ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == 'withastro/starlight')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: false
      - run: pnpm i --filter @astrojs/starlight
      - name: Run benchmarks
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: simulation
          run: pnpm --filter @astrojs/starlight bench
