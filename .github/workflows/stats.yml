name: Stats

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  stats:
    name: Update stats
    if: github.repository_owner == 'withastro'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm i

      - name: Run stats update
        run: pnpm stats
        working-directory: docs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ci/stats
          token: ${{ secrets.FREDKBOT_GITHUB_TOKEN }}
          commit-message: 'ci: update stats'
          title: 'ci: update stats'
          body: |
            This PR is auto-generated by a GitHub action to update stats available in Starlight documentation.

            Please also check [Website Carbon](https://www.websitecarbon.com/website/starlight-astro-build-getting-started/) to ensure the carbon rating is still up to date.
